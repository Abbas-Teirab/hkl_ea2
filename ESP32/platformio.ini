[env:esp32_wroom_da]
platform = espressif32
board = esp32_wroom_da
framework = arduino
lib_deps = 
	paulstoffregen/OneWire@^2.3.8
	milesburton/DallasTemperature@^4.0.6
	adafruit/Adafruit BME280 Library@^2.3.0
	bblanchon/ArduinoJson@^7.2.2
