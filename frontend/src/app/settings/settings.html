<div class="w-160">
  <div class="py-4 mb-4 flex items-center gap-x-2">
    <mat-icon>settings</mat-icon>
    <h1 class="text-2xl font-bold">Settings</h1>
  </div>
  <div class="flex items-center justify-between">
    <mat-form-field>
      <mat-label>Search</mat-label>
      <input matInput placeholder="Name, Location" [formField]="form.search" />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
    <button matButton="filled" color="primary" (click)="openNodeDialog()">
      <mat-icon>add</mat-icon> New
    </button>
  </div>
  @if (loading()) {
    <mat-spinner />
  } @else {
    <table
      mat-table
      matSort
      aria-label="Nodes table"
      [dataSource]="datasource()"
      (matSortChange)="onSort($event)"
    >
      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Node Name</th>
        <td mat-cell *matCellDef="let node">{{ node.name }}</td>
      </ng-container>

      <!-- Location Column -->
      <ng-container matColumnDef="location">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Location</th>
        <td mat-cell *matCellDef="let node">{{ node.location }}</td>
      </ng-container>

      <!-- Transmission Period Column -->
      <ng-container matColumnDef="transmission_period">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Transmission Period (sec)</th>
        <td mat-cell *matCellDef="let node">{{ node.transmission_period }}</td>
      </ng-container>

      <!-- Enabled Column -->
      <ng-container matColumnDef="enabled">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Enabled</th>
        <td mat-cell *matCellDef="let node">
          <mat-icon
            [class.green]="node.enabled"
            [class.red]="!node.enabled"
            class="!w-12 !h-12 !text-4xl"
            >{{ node.enabled ? 'toggle_on' : 'toggle_off' }}</mat-icon
          >
        </td>
      </ng-container>

      <ng-container matColumnDef="edit">
        <th mat-header-cell *matHeaderCellDef>Edit</th>
        <td mat-cell *matCellDef="let node">
          <button mat-icon-button color="primary" (click)="openNodeDialog(node)">
            <mat-icon>edit</mat-icon>
          </button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
    <mat-paginator
      [length]="datasource().length"
      [pageSize]="pageSize()"
      [pageIndex]="pageIndex()"
      [pageSizeOptions]="[10, 20, 50]"
      (page)="onPage($event)"
      aria-label="Nodes pagination"
    />
  }
</div>
