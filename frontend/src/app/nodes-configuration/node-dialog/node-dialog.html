<div class="p-6 h-full flex flex-col">
  <form class="flex flex-col">
    <h1 class="mb-8 text-2xl font-bold">{{ node() ? node()?.name : 'New Node' }}</h1>
    <mat-form-field>
      <mat-label>Node Name</mat-label>
      <input matInput placeholder="Ex. Node 1" [formField]="form.name" />
    </mat-form-field>
    <mat-form-field>
      <mat-label>Node Location</mat-label>
      <input matInput placeholder="Ex. Location 1" [formField]="form.location" />
    </mat-form-field>
    <mat-checkbox class="example-margin" [formField]="form.enabled"> Enabled </mat-checkbox>
  </form>
  <div class="basis-full flex justify-end items-end">
    <button matButton="filled" color="accent" [disabled]="form().invalid()" (click)="save()">
      <mat-icon>save</mat-icon> Save
    </button>
  </div>
</div>
