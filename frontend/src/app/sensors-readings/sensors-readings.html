<div class="py-4 mb-4 flex items-center gap-x-2">
  <mat-icon>speed</mat-icon>
  <h1 class="text-2xl font-bold">Current Readings</h1>
</div>
<div class="flex items-center justify-between">
  <mat-form-field>
    <mat-label>Search</mat-label>
    <input matInput placeholder="Name, Location" [formField]="form.search" />
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>
</div>
<div class="flex flex-wrap gap-4">
  @for (sensor_reading of readings.value(); track sensor_reading.id) {
    <app-sensor-reading [sensor_reading]="sensor_reading" />
  }
</div>
