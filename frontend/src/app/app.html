@if (loading()) {
  <div class="h-[75vh] flex justify-center items-center">
    <mat-spinner />
  </div>
} @else {
  <div class="flex gap-2 flex-wrap">
    @for (reading of readings(); track reading.id) {
      <app-node [reading]="reading" />
    } @empty {
      <p>There are no data received from nodes</p>
    }
  </div>
}
