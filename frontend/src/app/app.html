<mat-sidenav-container class="sidenav-container">
  <mat-sidenav [mode]="isMobile() ? 'over' : 'side'" [opened]="sidenavOpen()" class="sidenav">
    <mat-nav-list>
      <a
        mat-list-item
        routerLinkActive="active-link"
        [routerLink]="'/main/sensors-readings'"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeSidenavOnMobile()"
      >
        <mat-icon matListItemIcon>speed</mat-icon>
        <span matListItemTitle>Current Readings</span>
      </a>
      <a
        mat-list-item
        routerLinkActive="active-link"
        [routerLink]="'/main/nodes-configuration'"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeSidenavOnMobile()"
      >
        <mat-icon matListItemIcon>hub</mat-icon>
        <span matListItemTitle>Nodes Configuration</span>
      </a>
      <a
        mat-list-item
        routerLinkActive="active-link"
        [routerLink]="'/main/locks-triggers'"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeSidenavOnMobile()"
      >
        <mat-icon matListItemIcon>lock_open</mat-icon>
        <span matListItemTitle>Locks Triggers</span>
      </a>
      <a
        mat-list-item
        routerLinkActive="active-link"
        [routerLink]="'/main/statistics'"
        [routerLinkActiveOptions]="{ exact: false }"
        (click)="closeSidenavOnMobile()"
      >
        <mat-icon matListItemIcon>bar_chart</mat-icon>
        <span matListItemTitle>Statistics</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content class="sidenav-content">
    <mat-toolbar class="toolbar">
      <button mat-icon-button (click)="toggleSidenav()" aria-label="Toggle navigation">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="toolbar-title">Muscat Airport Monitoring System</span>
      <span class="spacer"></span>
    </mat-toolbar>
    <main class="page-content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
