<mat-card class="example-card" appearance="outlined">
  <mat-card-header>
    <mat-card-title>{{ reading().location }}</mat-card-title>
    <mat-card-subtitle>{{ reading().created_at | date: 'dd MMM yyyy HH:mm:ss' }}</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <div class="flex gap-2 flex-wrap">
      <ngx-gauge
        type="full"
        cap="round"
        [size]="120"
        [thick]="5"
        [duration]="1000"
        [value]="formatted_temperature_value()"
        [append]="'C'"
        [thresholds]="temperature_thresholds"
      />
      <ngx-gauge
        type="full"
        cap="round"
        [size]="120"
        [thick]="5"
        [duration]="1000"
        [value]="formatted_pressure_value()"
        [append]="'hPa'"
        [thresholds]="pressure_thresholds"
      />
    </div>
  </mat-card-content>
</mat-card>
